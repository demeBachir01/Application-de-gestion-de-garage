      <div class="container"  >
        <div id="connexion" >
          <h1 class="title">Hellø Wørld</h1>
          <p class="paragraphe">
            Veuillez entrer vos détails personnel et démarrez votre journée sur Hellø Wørld
          </p>
          <div class="container" class="mg-auto">
            <form class="formulaire" #userForm="ngForm" (ngSubmit)="onSubmit()">

                <div class="group-form">
                  <!-- <span class="text-danger">*</span> -->
                  <input type="email" name="email" id="email" (keyup)="emailVerif(email.value)" required
                    [class.is-invalid]="emailError || (email.invalid && email.touched ) " [class.is-valid]="email.valid"
                    #email="ngModel" [(ngModel)]="user.email" tabindex="2" class="form-control" placeholder="Email">
                  <div *ngIf="emailError || (email.touched && email.invalid)">
                    <small class="text-danger" [class.d-none]=" email.untouched || email.valid"> Veuillez saisir votre email
                    </small>
                    <small class="text-danger" [class.d-none]="!emailError || email.value == ''"> Veuillez saisir l'email au bon
                      format</small>
                  </div>
                  <div class="icon-mail"></div>
                </div>

                <div class="group-form">
                  <input type="password" name="password" id="password" (keyup)="passwordLengthVerif(password.value)" required
                  [class.is-invalid]="passError || (password.invalid && password.touched )" [class.is-valid]="password.valid"
                  #password="ngModel" [(ngModel)]="user.password" tabindex="2" class="form-control" placeholder="Password">
                <div *ngIf="passError || (password.touched && password.invalid)">
                  <small class="text-danger" [class.d-none]="password.untouched || password.valid"> Veuillez remplir ce
                    champ</small>
                  <small class="text-danger" [class.d-none]="!passError || password.value == ''"> Minimun 6 caractéres</small>
                </div>
                </div>
                <button type="submit" class="btn connexion"> Se connecter</button>
            </form>
          </div>
        </div>
        </div>
<app-footer></app-footer>
